<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="robots" content="noindex">
<title>Trilha ENADE · SimulaPro</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--bg:#f1f3f8;--card:#fff;--ink:#141a2b;--mute:#5d6578;--line:#dde2ec;--navy:#1F3864;--acc:#FF3B5F;
--ok:#16784a;--okb:#dcf2e6;--bad:#b8322a;--badb:#fbe4e1;--warn:#8a5a00;--warnb:#fdf0cf;--sel:#e7edf8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#181d2c;--ink:#eef1f8;--mute:#9aa3b8;--line:#2b3247;--navy:#9db8ec;
--ok:#5bd49b;--okb:#13301f;--bad:#ff8a80;--badb:#3a1b19;--warn:#f5c75a;--warnb:#372a0a;--sel:#22304d}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header .logo{width:38px;height:38px;border-radius:10px;background:#1F3864;display:grid;place-items:center;flex:none}
header h1{font-size:18px;font-weight:800}header small{display:block;color:var(--mute);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:20px;margin-bottom:6px;letter-spacing:-.01em}h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 2px 8px}
.lbl{font-size:13px;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:12px;padding:14px 16px;font:600 16px system-ui,sans-serif;cursor:pointer;background:#1F3864;color:#fff}
.btn.acc{background:var(--acc)}.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--navy);font:600 14px system-ui,sans-serif;cursor:pointer;padding:6px 0}
.stack>*+*{margin-top:10px}
input.cod{width:100%;font:700 26px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.warn{background:var(--warnb);color:var(--warn)}
.rod{display:flex;align-items:center;gap:12px;cursor:pointer}.rod .n{flex:none;width:44px;height:44px;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:17px}
.rod.aberta{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.rod.aberta .n{background:var(--acc);color:#fff}
.rod.futura{opacity:.6;cursor:default}
.q .tema{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.q .enun{margin:6px 0 12px;white-space:pre-wrap}
.q img{display:block;max-width:100%;max-height:340px;margin:0 auto 12px;border-radius:8px;background:#fff}
.alt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:8px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.alt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13.5px}
.alt.on{border-color:var(--navy);background:var(--sel)}.alt.on b{background:#1F3864;border-color:#1F3864;color:#fff}
.alt.certa{border-color:var(--ok);background:var(--okb)}.alt.certa b{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.errada{border-color:var(--bad);background:var(--badb)}.alt.errada b{background:var(--bad);border-color:var(--bad);color:#fff}
.alt:disabled{cursor:default}
.coment{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14.5px;white-space:pre-wrap}
.big{font-size:44px;font-weight:800;line-height:1.05}
.barra{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.erro{background:var(--badb);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.lgpd p+p{margin-top:8px}.lgpd ul{margin:8px 0 0 20px}.lgpd li+li{margin-top:4px}
#carregando{text-align:center;padding:50px 0;color:var(--mute)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="7" cy="8" r="3.4" fill="#FF3B5F"/><circle cx="17" cy="8" r="3.4" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="7" cy="17" r="3.4" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="17" cy="17" r="3.4" fill="#fff"/></svg></div>
    <div style="flex:1;min-width:0"><h1>Trilha ENADE</h1><small id="sub">SimulaPro · área do aluno</small></div>
  </header>
  <main id="tela"><div id="carregando">Carregando…</div></main>
</div>
<script>
'use strict';
const API = '../api/trilha.php', CHAVE = 'sp:aluno:codigo', LETRAS = 'ABCDE';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtData = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const fmtNota = x => x == null ? '–' : (+x).toLocaleString('pt-BR', {maximumFractionDigits: 1});
const ler = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const gravar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} };
let codigo = null, info = null, rodada = null, marcadas = [];

async function api(acao, dados = {}){
  let r, j = {};
  try { r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({acao, codigo, ...dados})}); }
  catch(e){ throw new Error('Sem conexão com a internet. Tente de novo.'); }
  try { j = await r.json(); } catch(e){}
  if(!r.ok || !j.ok){ const e = new Error(j.erro || 'Não foi possível falar com o servidor (' + r.status + ').'); e.status = r.status; throw e; }
  return j;
}
function tela(h){ $('#tela').innerHTML = h; window.scrollTo(0, 0); }
function erro(msg){ return msg ? '<div class="erro">' + esc(msg) + '</div>' : ''; }

// ---------------- código
function telaCodigo(msg){
  tela('<div class="card"><h2>Entre com o seu código</h2><p class="lbl">O seu professor entregou um código individual com 8 letras e números (ex.: K7F2-9QXM). Você só precisa digitar uma vez neste aparelho.</p>' +
    '<form onsubmit="event.preventDefault();entrar($(\'#cod\').value)" style="margin-top:14px" class="stack">' +
    '<input id="cod" class="cod" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" aria-label="Código">' +
    '<button class="btn acc" id="bEntrar">Entrar</button></form>' + erro(msg) + '</div>' +
    '<p class="lbl" style="text-align:center">Não tem o código ou perdeu? Peça ao seu professor.</p>');
  setTimeout(() => $('#cod') && $('#cod').focus(), 50);
}
async function entrar(c, aceitar){
  codigo = String(c || '').trim().toUpperCase();
  if(codigo.replace(/[^A-Z0-9]/g, '').length !== 8) return telaCodigo('O código tem 8 letras e números.');
  const b = $('#bEntrar'); if(b) b.disabled = true;
  try {
    info = await api('aluno_entrar', aceitar ? {aceitar: true} : {});
    gravar(CHAVE, codigo);
    if(!info.aceite) return telaPrivacidade();
    inicio();
  } catch(e){ if(e.status === 404 || e.status === 429 || e.status === 403) gravar(CHAVE, null); telaCodigo(e.message); }
}
function sair(){ if(!confirm('Sair deste aparelho? Para voltar, você vai precisar digitar o código de novo.')) return; gravar(CHAVE, null); codigo = null; info = null; telaCodigo(); }

// ---------------- privacidade (LGPD)
function telaPrivacidade(){
  const t = info.trilha;
  tela('<div class="card lgpd"><h2>Olá, ' + esc(primeiro(info.aluno)) + '!</h2>' +
    '<p>Você foi convidado(a) para a <b>' + esc(t.nome) + '</b>' + (t.professor ? ', do(a) professor(a) <b>' + esc(t.professor) + '</b>' : '') + '. A cada 15 dias abre uma rodada de questões no estilo do ENADE para você treinar.</p>' +
    '<h3 style="margin-top:16px">Como seus dados são usados</h3><ul>' +
    '<li>O SimulaPro guarda só o seu nome (cadastrado pelo professor), as suas respostas e as suas notas da trilha.</li>' +
    '<li>Não pedimos e-mail, telefone, CPF nem senha. O seu código é a sua chave: não passe para ninguém.</li>' +
    '<li>Os dados ficam no servidor do professor e só ele vê as suas notas, para acompanhar a turma e preparar as aulas.</li>' +
    '<li>Os dados não são vendidos nem compartilhados. Você pode pedir ao professor, a qualquer momento, para ver ou apagar os seus dados.</li>' +
    '<li>É um treino: pergunte ao professor se a trilha conta pontos na disciplina.</li></ul>' +
    '<div class="stack" style="margin-top:16px"><button class="btn acc" onclick="entrar(codigo, true)">Li e quero participar</button>' +
    '<button class="btn sec" onclick="gravar(CHAVE, null);codigo=null;telaCodigo()">Agora não</button></div></div>' +
    '<p class="lbl" style="text-align:center">Não é você? Toque em "Agora não" e confira o código.</p>');
}
const primeiro = n => String(n || '').trim().split(/\s+/)[0].toLowerCase().replace(/(^|\s)\S/g, x => x.toUpperCase());

// ---------------- início
function inicio(){
  const t = info.trilha, R = info.rodadas;
  $('#sub').textContent = [t.disciplina || t.nome, t.professor].filter(Boolean).join(' · ');
  const feitas = R.filter(r => r.enviada), media = feitas.length ? feitas.reduce((s, r) => s + r.nota, 0) / feitas.length : null;
  const aberta = R.find(r => r.estado === 'aberta');
  let h = '<div class="card"><div class="lbl">Olá, ' + esc(primeiro(info.aluno)) + '</div><h2 style="margin:2px 0 10px">' + esc(t.nome) + '</h2>' +
    '<div style="display:flex;gap:10px">' +
    '<div style="flex:1;background:var(--bg);border-radius:12px;padding:10px 12px"><div class="lbl">Rodadas feitas</div><div style="font-size:26px;font-weight:800">' + feitas.length + '<span class="lbl" style="font-size:15px"> de ' + R.filter(r => r.estado !== 'futura').length + '</span></div></div>' +
    '<div style="flex:1;background:var(--bg);border-radius:12px;padding:10px 12px"><div class="lbl">Sua média</div><div style="font-size:26px;font-weight:800">' + fmtNota(media) + '</div></div></div>';
  if(aberta && !aberta.enviada) h += '<button class="btn acc" style="margin-top:12px" onclick="abrirRodada(' + aberta.k + ')">Responder a rodada ' + (aberta.k + 1) + '</button><p class="lbl" style="margin-top:6px;text-align:center">Aberta até ' + fmtData(aberta.ate) + ' · ' + aberta.n + ' questões</p>';
  else if(aberta) h += '<p class="lbl" style="margin-top:12px">Você já fez a rodada ' + (aberta.k + 1) + '. A próxima abre em ' + fmtData(proxAbre(R, aberta.k)) + '.</p>';
  else { const f = R.find(r => r.estado === 'futura'); h += '<p class="lbl" style="margin-top:12px">' + (f ? 'A próxima rodada abre em ' + fmtData(f.abre) + '.' : 'A trilha terminou. Confira o gabarito das rodadas abaixo.') + '</p>'; }
  h += '</div><h3>Calendário</h3>';
  R.forEach(r => {
    const st = r.estado === 'futura' ? '<span class="pill">abre ' + fmtData(r.abre) + '</span>' :
      r.enviada ? '<span class="pill ' + (r.nota >= 6 ? 'ok' : 'warn') + '">nota ' + fmtNota(r.nota) + '</span>' :
      r.estado === 'aberta' ? '<span class="pill bad">responder</span>' : '<span class="pill">não feita</span>';
    const sub = r.estado === 'futura' ? 'De ' + fmtData(r.abre) + ' a ' + fmtData(r.ate) : r.estado === 'aberta' ? 'Aberta até ' + fmtData(r.ate) + (r.enviada ? ' · gabarito depois dessa data' : '') : 'Fechada · ' + (r.enviada ? 'ver gabarito comentado' : 'ver questões');
    h += '<div class="card rod ' + r.estado + '"' + (r.estado !== 'futura' ? ' onclick="abrirRodada(' + r.k + ')"' : '') + '><div class="n">' + (r.k + 1) + '</div>' +
      '<div style="flex:1;min-width:0"><b>Rodada ' + (r.k + 1) + '</b><div class="lbl">' + sub + '</div></div>' + st + '</div>';
  });
  h += '<p style="text-align:center;margin-top:16px"><button class="link" onclick="sair()">Sair deste aparelho</button></p>';
  tela(h);
}
function proxAbre(R, k){ const p = R[k + 1]; return p ? p.abre : ''; }

// ---------------- rodada
const chaveRasc = k => 'sp:aluno:rasc:' + codigo + ':' + k;
async function abrirRodada(k){
  tela('<div id="carregando">Abrindo a rodada…</div>');
  try { rodada = await api('aluno_rodada', {k}); rodada.k = k; }
  catch(e){ tela('<div class="card">' + erro(e.message) + '<button class="btn sec" style="margin-top:12px" onclick="voltar()">Voltar</button></div>'); return; }
  if(rodada.perdida) return tela('<button class="link" onclick="voltar()">‹ Voltar</button><div class="card"><h2>Rodada ' + (k + 1) + '</h2><p>Esta rodada fechou em ' + fmtData(rodada.rodada.ate) + ' e você não chegou a abri-la. As próximas rodadas trazem questões novas.</p></div>');
  if(rodada.enviada || rodada.rodada.estado === 'fechada') return resultado();
  try { marcadas = JSON.parse(ler(chaveRasc(k)) || 'null') || []; } catch(e){ marcadas = []; }
  if(marcadas.length !== rodada.questoes.length) marcadas = rodada.questoes.map(() => -1);
  responder();
}
function responder(){
  const r = rodada, Q = r.questoes;
  let h = '<button class="link" onclick="voltar()">‹ Voltar</button><div class="card"><h2>Rodada ' + (r.k + 1) + '</h2><p class="lbl">' + Q.length + ' questões · aberta até ' + fmtData(r.rodada.ate) +
    '. Suas respostas ficam guardadas neste aparelho até você enviar. Depois de enviar não dá para mudar.</p></div>';
  Q.forEach((q, i) => {
    h += '<div class="card q"><div class="tema">Questão ' + (i + 1) + ' · ' + esc(q.tema) + '</div><div class="enun">' + esc(q.enunciado) + '</div>' + (q.img ? '<img alt="Figura da questão" src="' + esc(q.img) + '">' : '') +
      q.alts.map((a, j) => '<button class="alt' + (marcadas[i] === j ? ' on' : '') + '" onclick="marcar(' + i + ',' + j + ')"><b>' + LETRAS[j] + '</b><span>' + esc(a) + '</span></button>').join('') + '</div>';
  });
  const n = marcadas.filter(x => x >= 0).length;
  h += '<div class="barra"><button class="btn acc" id="bEnviar" onclick="enviar()">Enviar respostas (' + n + ' de ' + Q.length + ')</button></div>';
  const y = window.scrollY; tela(h); window.scrollTo(0, y);
}
function marcar(i, j){
  marcadas[i] = marcadas[i] === j ? -1 : j; gravar(chaveRasc(rodada.k), JSON.stringify(marcadas));
  document.querySelectorAll('.q')[i].querySelectorAll('.alt').forEach((b, x) => b.classList.toggle('on', x === marcadas[i]));
  $('#bEnviar').textContent = 'Enviar respostas (' + marcadas.filter(x => x >= 0).length + ' de ' + marcadas.length + ')';
}
async function enviar(){
  const falta = marcadas.filter(x => x < 0).length;
  if(!confirm(falta ? 'Você deixou ' + falta + ' questão(ões) em branco. Enviar assim mesmo?' : 'Enviar as respostas? Depois não dá para mudar.')) return;
  const b = $('#bEnviar'); b.disabled = true; b.textContent = 'Enviando…';
  try {
    await api('aluno_enviar', {k: rodada.k, respostas: marcadas});
    gravar(chaveRasc(rodada.k), null);
    info = await api('aluno_entrar');
    await abrirRodada(rodada.k);
  } catch(e){ b.disabled = false; b.textContent = 'Tentar enviar de novo'; alert(e.message); }
}
function resultado(){
  const r = rodada, Q = r.questoes, fechada = r.rodada.estado === 'fechada';
  let h = '<button class="link" onclick="voltar()">‹ Voltar</button><div class="card" style="text-align:center"><div class="lbl">Rodada ' + (r.k + 1) + '</div>' +
    (r.enviada ? '<div class="big" style="margin:6px 0">' + fmtNota(r.nota) + '</div><div>' + r.acertos + ' de ' + Q.length + ' acertos</div>'
               : '<p style="margin-top:6px">Você não enviou esta rodada. Veja abaixo o gabarito comentado para estudar.</p>') +
    (fechada ? '' : '<p class="lbl" style="margin-top:10px">O gabarito comentado aparece depois de ' + fmtData(r.rodada.ate) + ', quando a rodada fechar para toda a turma.</p>') + '</div>';
  Q.forEach((q, i) => {
    const marc = q.marcada, cor = q.correta;
    h += '<div class="card q"><div class="tema">Questão ' + (i + 1) + ' · ' + esc(q.tema) + (!r.enviada ? '' : ' · ' + (q.certa ? '<span style="color:var(--ok)">acertou</span>' : marc < 0 ? '<span style="color:var(--bad)">em branco</span>' : '<span style="color:var(--bad)">errou</span>')) + '</div>' +
      '<div class="enun">' + esc(q.enunciado) + '</div>' + (q.img ? '<img alt="Figura da questão" src="' + esc(q.img) + '">' : '') +
      q.alts.map((a, j) => {
        let c = '';
        if(fechada){ if(j === cor) c = ' certa'; else if(j === marc) c = ' errada'; }
        else if(j === marc) c = q.certa ? ' certa' : ' errada';
        return '<button class="alt' + c + '" disabled><b>' + LETRAS[j] + '</b><span>' + esc(a) + '</span></button>';
      }).join('') +
      (fechada && q.comentario ? '<div class="coment"><b>Comentário:</b> ' + esc(q.comentario) + '</div>' : '') + '</div>';
  });
  tela(h);
}
async function voltar(){
  tela('<div id="carregando">Carregando…</div>');
  try { info = await api('aluno_entrar'); inicio(); } catch(e){ telaCodigo(e.message); }
}

// ---------------- abertura: código no link (QR do papel) ou guardado no aparelho
(function(){
  const m = location.hash.match(/c=([A-Za-z0-9-]{8,12})/);
  if(m){ history.replaceState(null, '', location.pathname); entrar(m[1]); return; }
  const c = ler(CHAVE);
  c ? entrar(c) : telaCodigo();
})();
</script>
</body>
</html>
